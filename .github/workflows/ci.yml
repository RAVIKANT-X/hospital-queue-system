name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Build API image
        run: docker build -t carepoint-api .
      - name: Build frontend image
        run: docker build -t carepoint-frontend ./client
